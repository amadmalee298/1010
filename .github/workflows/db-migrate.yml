# Applies supabase/migrations to the hosted Supabase project.
# Run it from the GitHub website or app (works on iPhone, no computer needed):
#   Actions → "Database migrations" → Run workflow.
#
# Repository secrets (Settings → Secrets and variables → Actions). Use ONE of:
#   A) Connection string (simplest, no access token):
#        SUPABASE_DB_URL       Supabase → Connect → "Session pooler" URI, pasted as shown
#                              (keep the [YOUR-PASSWORD] placeholder or put the real password in)
#        SUPABASE_DB_PASSWORD  the database password chosen when the project was created
#   B) Access token:
#        SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
name: Database migrations

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (list migrations that would run, change nothing)'
        type: boolean
        default: true

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Choose connection method
        id: target
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            url="$(scripts/resolve-db-url.sh)"
            echo "::add-mask::$url"
            echo "args=--db-url $url" >> "$GITHUB_OUTPUT"
            echo "Using connection string (SUPABASE_DB_URL)"
          elif [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
            echo "args=--password $SUPABASE_DB_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "Using access token + project ref"
          else
            echo "::error::Add secret SUPABASE_DB_URL (+ SUPABASE_DB_PASSWORD), or SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF + SUPABASE_DB_PASSWORD"
            exit 1
          fi

      - name: Preview migrations (dry run)
        if: ${{ inputs.dry_run }}
        run: supabase db push --dry-run ${{ steps.target.outputs.args }}

      - name: Apply migrations
        if: ${{ !inputs.dry_run }}
        run: supabase db push ${{ steps.target.outputs.args }}

      - name: Show migration status
        if: ${{ !inputs.dry_run }}
        run: supabase migration list ${{ steps.target.outputs.args }}
