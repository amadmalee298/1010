# Applies supabase/migrations to the hosted Supabase project.
# Run it from the GitHub website or app (works on iPhone, no computer needed):
#   Actions → "Database migrations" → Run workflow.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    the project id in the dashboard URL (supabase.com/dashboard/project/<ref>)
#   SUPABASE_DB_PASSWORD    the database password chosen when the project was created
name: Database migrations

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (list migrations that would run, change nothing)'
        type: boolean
        default: true

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; missing=1; fi
          done
          exit $missing

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview migrations (dry run)
        if: ${{ inputs.dry_run }}
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        if: ${{ !inputs.dry_run }}
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Show migration status
        if: ${{ !inputs.dry_run }}
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
